services:
  app:
    build:
      context: .
    container_name: drugstore-app
    ports:
      - "8000:80"
    environment:
      APP_NAME: DonatellosAdmin
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: donatellos_mysql
      DB_PORT: 3306
      DB_DATABASE: donatellos_db
      DB_USERNAME: donatellos_user
      DB_PASSWORD: donatellos_pass
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    volumes:
      - ../../DonatellosPizza/backend/src/storage:/var/www/html/storage
    networks:
      - default
      - backend

networks:
  backend:
    external: true
    name: backend_default
